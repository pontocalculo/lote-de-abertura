<style>
  :root { --deep: #0B241A; --leaf: #0B7443; --snow: #F7FAF6; --ink-soft: #4A5F54; --line: rgba(11, 36, 26, .14); --acao: #F07818; --acao-h: #D9660B; --acao-ink: #2A1200; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(120% 90% at 30% 10%, #14402A 0%, var(--deep) 60%); color: var(--deep); font: 500 14px/1.45 "Inter", system-ui, sans-serif; }
  form { width: min(100%, 400px); padding: 34px 30px 30px; border-radius: 22px; background: var(--snow); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca img { width: 40px; height: 40px; }
  .marca b { display: block; font: 400 22px/1 "Anton", Impact, sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .marca small { display: block; margin-top: 3px; font: 700 10.5px/1 "Inter", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--leaf); }
  h1 { margin: 26px 0 6px; font: 400 30px/1 "Anton", Impact, sans-serif; text-transform: uppercase; }
  p { color: var(--ink-soft); }
  label { display: grid; gap: 6px; margin-top: 16px; font-weight: 600; font-size: 13px; }
  input { height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font: inherit; font-size: 15px; }
  input:focus { outline: none; border-color: var(--leaf); box-shadow: 0 0 0 3px rgba(11, 116, 67, .15); }
  button { width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 999px; background: var(--acao); color: var(--acao-ink); font: 700 15px/1 "Inter", sans-serif; cursor: pointer; }
  button:hover { background: var(--acao-h); }
  button:disabled { opacity: .7; cursor: wait; }
  .erro { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #FDECEC; color: #9B1C1C; font-weight: 600; font-size: 13px; }
  .tranca { margin-top: 14px; font-size: 12px; text-align: center; }
  [hidden] { display: none !important; }
</style>

  var $ = function (s) { return document.querySelector(s); };
  function de64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function para64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function erro(t) { $('#lErro').hidden = false; $('#lErro').textContent = t; }
  async function abre(chave) {
    var claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: de64(C.iv) }, chave, de64(C.dados));
    var html = new TextDecoder().decode(claro);
    document.open(); document.write(html); document.close();
  }
  if (!window.crypto || !crypto.subtle) { erro('Este navegador bloqueou a abertura (a página precisa abrir em https).'); $('#lBtn').disabled = true; return; }
  var salva = null; try { salva = sessionStorage.getItem('pc_sim_k'); } catch (e) {}
  if (salva) {
    crypto.subtle.importKey('raw', de64(salva), 'AES-GCM', false, ['decrypt']).then(abre).catch(function () { try { sessionStorage.removeItem('pc_sim_k'); } catch (e) {} });
  }
  $('#login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var u = $('#lUsuario').value.trim().toLowerCase(), s = $('#lSenha').value;
    $('#lBtn').disabled = true; $('#lBtn').textContent = 'Abrindo...'; $('#lErro').hidden = true;
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(u + ':' + s), 'PBKDF2', false, ['deriveKey']);
      var chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: de64(C.sal), iterations: C.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      var bruta = await crypto.subtle.exportKey('raw', chave);
      await abre(chave);
      try { sessionStorage.setItem('pc_sim_k', para64(bruta)); } catch (e) {}
    } catch (e) {
      $('#lBtn').disabled = false; $('#lBtn').textContent = 'Entrar';
      erro('Usuário ou senha incorretos.'); $('#lSenha').value = ''; $('#lSenha').focus();
    }
  });
})();
